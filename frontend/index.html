<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Cloud Platform</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f6f8;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .status {
            font-weight: bold;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        pre {
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<header>
    <h1>🏏 Cricket Cloud Platform</h1>
    <p>AI-Powered Self-Healing Infrastructure</p>
</header>

<div class="container">

    <div class="cards">

        <div class="card">
            <h2>API Status</h2>
            <p id="api-status" class="status">Checking...</p>
            <button onclick="checkHealth()">Check Health</button>
        </div>

        <div class="card">
            <h2>Cricket Match</h2>
            <pre id="cricket-data">Loading...</pre>
            <button onclick="loadCricketData()">Refresh</button>
        </div>

    </div>

</div>

<script>
    const API_URL = "http://localhost:5001";

    async function checkHealth() {
        try {
            const response = await fetch(`${API_URL}/health`);
            const data = await response.json();

            document.getElementById("api-status").textContent =
                `🟢 ${data.status}`;
        } catch (error) {
            document.getElementById("api-status").textContent =
                "🔴 API unavailable";
        }
    }

    async function loadCricketData() {
        try {
            const response = await fetch(`${API_URL}/api/cricket`);
            const data = await response.json();

            document.getElementById("cricket-data").textContent =
                JSON.stringify(data, null, 2);
        } catch (error) {
            document.getElementById("cricket-data").textContent =
                "Unable to load cricket data.";
        }
    }

    checkHealth();
    loadCricketData();
</script>

</body>
</html>
