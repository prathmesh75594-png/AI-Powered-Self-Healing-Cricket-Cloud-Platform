apiVersion: apps/v1
kind: Deployment
metadata:
  name: cricket-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cricket-api

  template:
    metadata:
      labels:
        app: cricket-api

    spec:
      containers:
        - name: cricket-api
          image: cricket-api:1.4
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5